name: Build & Deploy Qt6 App

on:
  push:
    branches:
      - main
      - release/**
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/*.h'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(tr -d ' \r\n' < APP_VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dbus
        run: |
          brew update
          brew install dbus

      - name: Install Qt6
        run: |
          brew install qt@6
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

      - name: Build with qmake & make
        run: |
          qmake6 CONFIG+=release -r "QT+=dbus" "QMAKE_MACOS_ARCHITECTURES=arm64"
          # -f Makefile: the repo root also has a GNUmakefile (dev helper) that
          # GNU make would prefer over the qmake-generated Makefile.
          make -f Makefile -j$(sysctl -n hw.ncpu)

      - name: Prepare .app bundle
        run: |
          APP=".bin/SyntaxTutor.app"
          VERSION="${{ steps.version.outputs.value }}"
          mkdir -p $APP/Contents/{MacOS,Resources}

          chmod +x "$APP/Contents/MacOS/SyntaxTutor"

          # The .icns ships ready in resources/icon (16 to 1024 px); qmake
          # already copies it (ICON in the .pro). The name has to match
          # CFBundleIconFile exactly, case included: the runner's disk is
          # case-insensitive, so copying it as "SyntaxTutor.icns" kept the
          # existing lowercase file and the bundle showed no icon.
          cp resources/icon/syntaxtutor.icns "$APP/Contents/Resources/syntaxtutor.icns"
          chmod 644 "$APP/Contents/Resources/syntaxtutor.icns"

          cat > $APP/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>SyntaxTutor</string>
            <key>CFBundleExecutable</key>
            <string>SyntaxTutor</string>
            <key>CFBundleIdentifier</key>
            <string>com.uma.syntaxtutor</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleIconFile</key>
            <string>syntaxtutor.icns</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
          </dict>
          </plist>
          EOF

      - name: Run macdeployqt
        run: |
          macdeployqt .bin/SyntaxTutor.app \
            -verbose=2

      - name: Create entitlements
        run: |
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>com.apple.security.cs.disable-library-validation</key>
          <true/>
          </dict>
          </plist>
          EOF

      - name: Ad-hoc code signing
        run: |
          codesign --deep --force --options runtime --entitlements entitlements.plist --sign - .bin/SyntaxTutor.app

      - name: Create ZIP of .app (arm64)
        run: |
          cd .bin && ditto -c -k --keepParent SyntaxTutor.app ../SyntaxTutor-${{ steps.version.outputs.value }}-macos-arm64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SyntaxTutor-macos-arm64
          path: SyntaxTutor-${{ steps.version.outputs.value }}-macos-arm64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(tr -d ' \r\n' < APP_VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt 6 (x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Setup MSVC env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure & Build (Windows)
        shell: cmd
        run: |
          :: 1) Call vcvarsall
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          :: 2) Update PATH
          set PATH=D:\a\SyntaxTutor\Qt\6.8.3\msvc2022_64\bin;%PATH%

          :: 3) Configure and build
          qmake6 -r
          nmake /f Makefile.Release

      - name: Prepare Windows deploy
        shell: pwsh
        run: |
          $pkg = "SyntaxTutor-${{ steps.version.outputs.value }}-windows-x64"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item .\.bin\SyntaxTutor.exe "$pkg\"
          windeployqt --release "$pkg\SyntaxTutor.exe" --dir $pkg

      - name: Zip Windows bundle
        shell: pwsh
        run: |
          $pkg = "SyntaxTutor-${{ steps.version.outputs.value }}-windows-x64"
          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip"

      - name: Upload zipped Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: SyntaxTutor-windows-x64
          path: SyntaxTutor-${{ steps.version.outputs.value }}-windows-x64.zip

  build-linux:
    # The oldest Ubuntu LTS GitHub still offers. The AppImage carries the C
    # and C++ runtime requirements of the system it is built on, so built on
    # ubuntu-latest (24.04) it would not start on Ubuntu 22.04, Debian 12 or
    # anything else with an older glibc or libstdc++.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(tr -d ' \r\n' < APP_VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.2
          cache: true

      - name: Configure with qmake
        run: |
          qmake6 -r -config release

      - name: Build
        run: |
          # -f Makefile: the repo root also has a GNUmakefile (dev helper) that
          # GNU make would prefer over the qmake-generated Makefile.
          make -f Makefile -j$(nproc)

      - name: Install Wayland client libraries
        # Needed so linuxdeploy can resolve the Qt Wayland plugin's
        # dependencies. The libraries themselves stay out of the AppImage:
        # every Wayland system has its own.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Generate AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          export LD_VER=continuous
          # Ship the Wayland platform plugin next to X11 (xcb). The app still
          # starts on X11 - through XWayland on a Wayland desktop - and uses
          # Wayland only without an X server or with QT_QPA_PLATFORM=wayland
          # (see main.cpp).
          export EXTRA_PLATFORM_PLUGINS="libqwayland-egl.so;libqwayland-generic.so"
          APPDIR=SyntaxTutor.AppDir

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/${LD_VER}/linuxdeploy-x86_64.AppImage \
            -O /usr/local/bin/linuxdeploy && \
          chmod +x /usr/local/bin/linuxdeploy && \
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${LD_VER}/linuxdeploy-plugin-qt-x86_64.AppImage \
          -O /usr/local/bin/linuxdeploy-plugin-qt && \
          chmod +x /usr/local/bin/linuxdeploy-plugin-qt

          mkdir -p $APPDIR/usr/bin
          # Every size of the icon, so desktops do not scale the 256 px one.
          for size in 16 24 32 48 64 128 256 512; do
            install -Dm644 resources/icon/png/syntaxtutor-$size.png \
              $APPDIR/usr/share/icons/hicolor/${size}x${size}/apps/syntaxtutor.png
          done

          cp .bin/SyntaxTutor $APPDIR/usr/bin/ && \
            printf '[Desktop Entry]\nType=Application\nIcon=syntaxtutor\nName=SyntaxTutor\nExec=SyntaxTutor\nCategories=Education;\n' > $APPDIR/SyntaxTutor.desktop && \
            chmod +x $APPDIR/SyntaxTutor.desktop && \
            /usr/local/bin/linuxdeploy \
              --appdir $APPDIR \
              --desktop-file $APPDIR/SyntaxTutor.desktop \
              --icon-file $APPDIR/usr/share/icons/hicolor/256x256/apps/syntaxtutor.png \
              --plugin qt \
              --output appimage

      - name: Rename AppImage
        run: |
          # No "linux" in the name: every AppImage is for Linux (AppImage
          # naming convention: App-1.0-x86_64.AppImage).
          mv SyntaxTutor-x86_64.AppImage SyntaxTutor-${{ steps.version.outputs.value }}-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SyntaxTutor-linux-x86_64
          path: SyntaxTutor-${{ steps.version.outputs.value }}-x86_64.AppImage

  publish-prerelease:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    name: Publish prerelease
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
      - build-linux
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Determine release version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(tr -d ' \r\n' < APP_VERSION)
            if [ -z "$VERSION" ]; then
              echo "APP_VERSION file is empty" >&2
              exit 1
            fi
            echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Download macOS (arm64) artifact
        uses: actions/download-artifact@v4
        with:
          name: SyntaxTutor-macos-arm64
          path: dist/macos-arm64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SyntaxTutor-windows-x64
          path: dist/windows-x64

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: SyntaxTutor-linux-x86_64
          path: dist/linux-x86_64

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist/uploads
          VERSION="${{ steps.version.outputs.value }}"

          find dist/macos-arm64  -name "*.zip" -exec cp {} dist/uploads/ \;
          find dist/windows-x64  -name "*.zip" -exec cp {} dist/uploads/ \;
          find dist/linux-x86_64 -name "*.AppImage" -exec cp {} dist/uploads/ \;

          echo "Prepared artifacts:" >&2
          ls -al dist/uploads >&2

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: SyntaxTutor v${{ steps.version.outputs.value }}
          body: |
            Automated build for v${{ steps.version.outputs.value }} — commit ${{ github.sha }}.
          prerelease: ${{ contains(steps.version.outputs.value, '-rc') || contains(steps.version.outputs.value, '-beta') || contains(steps.version.outputs.value, '-alpha') || github.ref == 'refs/heads/main' }}
          files: dist/uploads/*
          fail_on_unmatched_files: true
          draft: false
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
